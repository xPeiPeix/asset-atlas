    />
    <title>Asset Atlas · 资产总览</title>
    <script>
      (() => {
        const appearanceKey = "asset-atlas.appearance";
        const paletteKey = "asset-atlas.palette";
        const allowedAppearances = new Set(["light", "dark", "system"]);
        const allowedPalettes = new Set(["aurum", "slate"]);
        let appearance = "system";
        let palette = "aurum";
        try {
          const storedAppearance = localStorage.getItem(appearanceKey);
          if (allowedAppearances.has(storedAppearance)) {
            appearance = storedAppearance;
          }
          const storedPalette = localStorage.getItem(paletteKey);
          if (allowedPalettes.has(storedPalette)) palette = storedPalette;
        } catch {}
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const resolved =
          appearance === "system" ? (prefersDark ? "dark" : "light") : appearance;
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.palette = palette;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
